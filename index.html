<!DOCTYPE html>
<html lang="en">
<head>
    <title>myntra clone</title>
    <link rel="stylesheet" href="myntra.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <header>
        <div class="logo_container">
            <a href="#"><img class="myntra_logo" src="images/mintra_logo1.jpeg" alt=""></a>
        </div>
        <nav class="nav_container">
            <a href="#">Man</a>
            <a href="#">Woman</a>
            <a href="#">kids</a>
            <a href="#">Home & Living</a>
            <a href="#">beauty</a>
            <a href="#">Studio <sup>new</sup></a>
        </nav>
        <div class="search_bar">
            <span class="material-symbols-outlined search_icon" >search </span>
            <input class="search_input" placeholder="search for product,brand and more">
        </div>
        <div class="action_bar">
            <div class="action_container">
                <span class="material-symbols-outlined action_icon">person</span>
                <span class="action_name">profile</span>
            </div>

            <div class="action_container">
                <span class="material-symbols-outlined action_icon">favorite</span>
                <span class="action_name">wishlist</span>
            </div>
            
            <div class="action_container">
                <span class="material-symbols-outlined action_icon">shopping_bag</span>
                <span class="action_name">bag</span>
            </div>
        </div>
    </header>
    <main>
        <div class="banner_container">
            <img class="banner_img" src="images/banner.jpg" alt="main banner">
        </div>
        <div class="category_heading">medal worthy brands to bag</div>
        <div class="category_item">
            <a class="sale_item" href="#"><img src="images/offers/1.png"></a>
            <a class="sale_item" href="#"><img src="images/offers/2.png"></a>
            <a class="sale_item" href="#"><img src="images/offers/3.png"></a>
            <a class="sale_item" href="#"><img src="images/offers/4.png"></a>
            <a class="sale_item" href="#"><img src="images/offers/5.png"></a>
            <a class="sale_item" href="#"><img src="images/offers/6.png"></a>
            <a class="sale_item" href="#"><img src="images/offers/7.png"></a>
            <a class="sale_item" href="#"><img src="images/offers/8.png"></a>
            <a class="sale_item" href="#"><img src="images/offers/9.png"></a>
            <a class="sale_item" href="#"><img src="images/offers/10.png"></a>
            <a class="sale_item" href="#"><img src="images/offers/11.png"></a>
            <a class="sale_item" href="#"><img src="images/offers/12.png"></a>
        </div>

        <div class="category_heading">shop by category</div>
        <div class="category_item">
            <a class="" href="#"><img src="images/cetagory/1.jpg"></a>
            <a class="" href="#"><img src="images/cetagory/2.jpg"></a>
            <a class="" href="#"><img src="images/cetagory/3.jpg"></a>
            <a class="" href="#"><img src="images/cetagory/4.jpg"></a>
            <a class="" href="#"><img src="images/cetagory/5.jpg"></a>
            <a class="" href="#"><img src="images/cetagory/6.jpg"></a>
            <a class="" href="#"><img src="images/cetagory/7.jpg"></a>
            <a class="" href="#"><img src="images/cetagory/8.jpg"></a>
            <a class="" href="#"><img src="images/cetagory/9.jpg"></a>
            <a class="" href="#"><img src="images/cetagory/10.jpg"></a>
           
        </div>
    </main>
    <footer>
        <div class="footer_container">
            <div class="footer_col">
                <h3>online shopping</h3>
                <a href="#">Man</a>
                <a href="#">Woman</a>
                <a href="#">kids</a>
                <a href="#">Home & Living</a>
                <a href="#">beauty</a>
                <a href="#">gift cards</a>
                <a href="#">myntra insider</a>
            </div>
        </div>
        <hr>
        <div class="copy">
            © www.myntra.com. All rights reserved.
        </div>
    </footer>
</body>
</html>
